[package]
name = "pali"
version = "1.1.0"
edition = "2024"
license = "MIT"
description = "Pali — semantic memory server for AI agents. Pure-Rust embeddings, hybrid retrieval, git-backed storage."
repository = "https://github.com/cderivan/memory-mcp"
homepage = "https://github.com/cderivan/memory-mcp"
keywords = ["mcp", "memory", "embeddings", "semantic-search", "pali"]
categories = [
  "command-line-utilities",
  "artificial-intelligence",
  "text-processing",
]
rust-version = "1.99"
# The crate ships inside the VS Code extension; it is not published to a
# registry, so `cargo publish` must stay impossible by accident.
publish = false

[dependencies]
rmcp = { version = "3.8", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["full"] }
git2 = { version = "0.21.0", default-features = false, features = [
  "ssh",
  "https",
  "vendored-openssl",
] }
usearch = "2"

# BM25 keyword search for hybrid retrieval (pure Rust, Lucene-inspired).
tantivy = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
toml = "1.1"

# Deterministic FactId content digests for chunk-addressable retrieval
# (ADR-0042). Already in the tree transitively; this makes it direct.
sha2 = "0.11"
# Credential-shape detection for the repository scanner. Every pattern is a
# compile-time constant, so the regex set is compiled once per process.
regex = "1"
dirs = "7"
arc-swap = "1"
rusqlite = { version = "0.41", features = ["bundled"] }

# Candle direct — pure-Rust BERT inference for embeddings.
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"

# Pure-Rust YAML parsing; avoids unsafe-libyaml in memory frontmatter.
serde-saphyr = "2.0.0"
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "serde",
] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"

openssl = { version = "0.10", features = ["vendored"] }
libz-sys = { version = "1", features = ["static"] }

# HuggingFace Hub client for automatic model download on cache miss.
# Uses ureq and blocking features for lightweight, headless downloading.
hf-hub = { version = "1.0.0", default-features = false, features = [
  "rustls-tls",
  "blocking",
] }
# Disable defaults to drop onig (C regex library); fancy-regex is a pure-Rust
# drop-in. esaxx_fast is deliberately off: its C++ builder (esaxx-rs) unconditionally
# compiles with the static CRT (/MT), which conflicts with the dynamic CRT (/MD)
# used across the MSVC workspace and breaks linking (LNK2038). tokenizers falls
# back to the pure-Rust suffix-array builder.
tokenizers = { version = "0.23", default-features = false, features = [
  "progressbar",
  "fancy-regex",
] }

[target.'cfg(unix)'.dependencies]
# Platform-correct O_NOFOLLOW; std exposes no constant and hard-coded values
# silently follow symlinks on the other kernel family.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# libssh2's default Windows crypto backend (WinCNG) does not implement
# ed25519 — the common ssh-keygen default. Enable the OpenSSL backend so
# libssh2 can sign ed25519 userauth requests on Windows. The vendored
# OpenSSL is already in the tree via git2's vendored-openssl feature
# (ADR-0023); this is additive and feature-unions with git2/ssh.
libssh2-sys = { version = "0.3", features = ["openssl-on-win32"] }

[dev-dependencies]
# Property-based testing for contract invariants (ADR-0042 property ledger).
proptest = "1"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
async-trait = "0.1"


[package.metadata.sonar]
project-key = "memory-mcp"
exclusions = ["target/**", ".vscode-test/**"]
