name: Build Binaries

on:
  workflow_dispatch:

concurrency:
  group: binaries-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Cold builds compile candle, usearch, libgit2, and vendored OpenSSL.
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            ubuntu-latest)
              sudo apt-get update && sudo apt-get install -y g++
              ;;
            macos-latest)
              # macOS has clang++ in Xcode Command Line Tools
              xcode-select --install || true
              ;;
            windows-latest)
              # Windows MSVC has C++ compiler bundled with Visual Studio Build Tools
              echo "Using MSVC C++ compiler from Visual Studio"
              ;;
          esac

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add "${{ matrix.target }}"

      - name: Build release binary
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          case "${{ matrix.target }}" in
            *windows*) ext=".exe" ;;
          esac
          name="pali-${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/pali${ext}" "dist/${name}${ext}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pali-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
