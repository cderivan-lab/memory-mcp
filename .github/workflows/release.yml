name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  GITHUB_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag_name: ${{ github.ref_name }}
    steps:
      - name: Create draft release
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "::error::the GITHUB_TOKEN secret is not set"
            exit 1
          fi
          command -v jq >/dev/null || { echo "::error::jq is required to read Gitea API responses"; exit 1; }
          prerelease=false
          case "$TAG_NAME" in *-*) prerelease=true ;; esac
          payload=$(printf '{"tag_name":"%s","name":"%s","draft":true,"prerelease":%s}' \
            "$TAG_NAME" "$TAG_NAME" "$prerelease")
          code=$(curl -sS -o /tmp/release.json -w '%{http_code}' \
            -X POST "$GITHUB_API/releases" \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "$payload")
          case "$code" in
            201) echo "created draft release $TAG_NAME" ;;
            # A rerun after a partial failure must not abort here.
            409) echo "draft release $TAG_NAME already exists" ;;
            *)
              cat /tmp/release.json || true
              echo "::error::creating the release failed with HTTP $code"
              exit 1
              ;;
          esac

  publish-binaries:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            rust_targets: x86_64-unknown-linux-gnu
            assets: x86_64-unknown-linux-gnu
          # arm64 leg, native on the spacelab runner registered with the
          # `ubuntu-latest-arm64` label (infra/nomad/gitea.hcl, group
          # runner-arm64). The label has to match exactly: this instance
          # advertises no `self-hosted`, `linux`, or `arm64` label, and a label
          # nothing advertises leaves the job queued forever.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest-arm64
            rust_targets: aarch64-unknown-linux-gnu
            assets: aarch64-unknown-linux-gnu
          # Windows excluded until usearch supports it (see #42).
          - target: universal-apple-darwin
            os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            assets: aarch64-apple-darwin x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    # Cold builds compile candle, usearch, libgit2, and vendored OpenSSL.
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      TARGET: ${{ matrix.target }}
      ASSETS: ${{ matrix.assets }}
      TAG_NAME: ${{ needs.create-release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.create-release.outputs.tag_name }}
          persist-credentials: false
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (2026-03-27)
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}
      - name: Install cargo-auditable
        run: cargo install cargo-auditable@0.7.4 --locked
      - name: Build
        run: |
          set -euo pipefail
          # `pali/` at the repository root is the crate directory, so the binary
          # is staged in build/ rather than next to it.
          mkdir -p build
          case "$TARGET" in
            x86_64-unknown-linux-gnu | aarch64-unknown-linux-gnu)
              cargo auditable build --release --locked --target "$TARGET"
              cp "target/$TARGET/release/pali" build/pali
              ;;
            universal-apple-darwin)
              # One --target per invocation: repeating the flag silently keeps
              # only the last one, which left lipo without an arm64 input.
              for triple in aarch64-apple-darwin x86_64-apple-darwin; do
                cargo auditable build --release --locked --target "$triple"
              done
              lipo -create -output build/pali \
                target/aarch64-apple-darwin/release/pali \
                target/x86_64-apple-darwin/release/pali
              ;;
            *)
              echo "::error::Unknown target: $TARGET"
              exit 1
              ;;
          esac
          chmod 755 build/pali
      - name: Check the binary runs
        run: ./build/pali --version
      - name: Package and upload
        run: |
          set -euo pipefail
          archive="pali-${TAG_NAME}-${TARGET}"
          mkdir -p "dist/${archive}"
          cp build/pali "dist/${archive}/pali"
          tar -C dist -czf "dist/${archive}.tar.gz" "${archive}"
          rm -rf "dist/${archive}"
          for asset in $ASSETS; do
            case "$asset" in
              *apple-darwin) zip -q -j "dist/${asset}.zip" build/pali ;;
              *) tar -C build -czf "dist/${asset}.tgz" pali ;;
            esac
          done
          (cd dist && shasum -a 256 "${archive}.tar.gz" > "${archive}.tar.gz.sha256")

          command -v jq >/dev/null || { echo "::error::jq is required to read Gitea API responses"; exit 1; }
          api() { curl -sS -H "Authorization: token $GITHUB_TOKEN" "$@"; }
          release_id=$(api "$GITHUB_API/releases/tags/$TAG_NAME" | jq -r '.id')
          if [ -z "$release_id" ] || [ "$release_id" = null ]; then
            echo "::error::release $TAG_NAME not found on the Gitea instance"
            exit 1
          fi

          for file in dist/*; do
            name=${file##*/}
            for asset_id in $(api "$GITHUB_API/releases/$release_id/assets" \
                | jq -r --arg name "$name" '.[] | select(.name == $name) | .id'); do
              api -X DELETE "$GITHUB_API/releases/$release_id/assets/$asset_id" >/dev/null
            done
            api --fail-with-body -X POST "$GITHUB_API/releases/$release_id/assets?name=$name" \
              -H 'Content-Type: application/octet-stream' \
              --data-binary @"$file" >/dev/null
            echo "uploaded $name"
          done
      # Hand the same binary to publish-vsix instead of rebuilding it there.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pali-${{ matrix.target }}
          path: build/pali
          retention-days: 1

  publish-vsix:
    needs: [create-release, publish-binaries]
    strategy:
      fail-fast: false
      matrix:
        include:
          - vsix_target: linux-x64
            binary: x86_64-unknown-linux-gnu
          - vsix_target: linux-arm64
            binary: aarch64-unknown-linux-gnu
          - vsix_target: darwin-arm64
            binary: universal-apple-darwin
          - vsix_target: darwin-x64
            binary: universal-apple-darwin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ needs.create-release.outputs.tag_name }}
      VSIX_TARGET: ${{ matrix.vsix_target }}
    steps:
      # Needed on the self-hosted Gitea instance (internal CA); harmless on
      # GitHub-hosted runners.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.create-release.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pali-${{ matrix.binary }}
          path: .ci-bin
      - name: Stage the binary inside the extension
        run: |
          set -euo pipefail
          mkdir -p out/bin
          install -m 0755 .ci-bin/pali out/bin/pali
          # Packaging must not pick the staging directory up as extension content.
          rm -rf .ci-bin
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check the tag matches the crate version
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' pali/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ "v$version" != "$TAG_NAME" ]; then
            echo "::error::pali/Cargo.toml is $version but the tag is $TAG_NAME"
            exit 1
          fi
      - name: Package VSIX
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          out="dist/pali-memory-${version}-${VSIX_TARGET}.vsix"
          mkdir -p dist
          npm run package -- \
            --target "$VSIX_TARGET" \
            --baseContentUrl "https://github.com/cderivan/memory-mcp/src/branch/main" \
            --baseImagesUrl "https://github.com/cderivan/memory-mcp/raw/branch/main" \
            --out "$out"
          unzip -l "$out" | grep -F 'extension/out/bin/pali' >/dev/null
          ls -l "$out"
      - name: Upload VSIX
        run: |
          set -euo pipefail
          command -v jq >/dev/null || { echo "::error::jq is required to read Gitea API responses"; exit 1; }
          api() { curl -sS -H "Authorization: token $GITHUB_TOKEN" "$@"; }
          release_id=$(api "$GITHUB_API/releases/tags/$TAG_NAME" | jq -r '.id')
          if [ -z "$release_id" ] || [ "$release_id" = null ]; then
            echo "::error::release $TAG_NAME not found on the Gitea instance"
            exit 1
          fi
          for file in dist/*.vsix; do
            name=${file##*/}
            for asset_id in $(api "$GITHUB_API/releases/$release_id/assets" \
                | jq -r --arg name "$name" '.[] | select(.name == $name) | .id'); do
              api -X DELETE "$GITHUB_API/releases/$release_id/assets/$asset_id" >/dev/null
            done
            api --fail-with-body -X POST "$GITHUB_API/releases/$release_id/assets?name=$name" \
              -H 'Content-Type: application/octet-stream' \
              --data-binary @"$file" >/dev/null
            echo "uploaded $name"
          done

  # Undraft the release after every artifact is uploaded.
  publish-release:
    needs: [create-release, publish-binaries, publish-vsix]
    if: ${{ always() && needs.create-release.result == 'success' && needs.publish-binaries.result == 'success' && needs.publish-vsix.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          TAG_NAME: ${{ needs.create-release.outputs.tag_name }}
        run: |
          set -euo pipefail
          command -v jq >/dev/null || { echo "::error::jq is required to read Gitea API responses"; exit 1; }
          api() { curl -sS -H "Authorization: token $GITHUB_TOKEN" "$@"; }
          release_id=$(api "$GITHUB_API/releases/tags/$TAG_NAME" | jq -r '.id')
          if [ -z "$release_id" ] || [ "$release_id" = null ]; then
            echo "::error::release $TAG_NAME not found on the Gitea instance"
            exit 1
          fi
          api --fail-with-body -X PATCH "$GITHUB_API/releases/$release_id" \
            -H 'Content-Type: application/json' \
            -d '{"draft":false}' >/dev/null
          echo "published $TAG_NAME"
