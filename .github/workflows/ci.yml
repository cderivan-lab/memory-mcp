name: CI

on:
  workflow_dispatch:
    inputs:
      fmt-check:
        description: >-
          Run the cargo fmt --check gate. Off by default: rustfmt's
          line-breaking changes between releases, so the runner's stable
          toolchain can disagree with the author's on code nobody edited.
        type: boolean
        default: false
    inputs:
      fmt-check:
        description: >-
          Run the cargo fmt --check gate. Off by default: rustfmt's
          line-breaking changes between releases, so the runner's stable
          toolchain can disagree with the author's on code nobody edited.
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

