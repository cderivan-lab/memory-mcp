name: CI

on:
  workflow_dispatch:
    inputs:
      fmt-check:
        description: >-
          Run the cargo fmt --check gate. Off by default: rustfmt's
          line-breaking changes between releases, so the runner's stable
          toolchain can disagree with the author's on code nobody edited.
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config g++
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (2026-03-27)
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-bin: "false"
      - name: cargo fmt --check
        if: (github.event_name == 'workflow_dispatch' && inputs.fmt-check) || vars.FMT_CHECK == 'true'
        run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config g++
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (2026-03-27)
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: clippy-${{ matrix.features }}
          cache-bin: "false"
      - run: cargo clippy --workspace ${{ matrix.features }} -- -D warnings

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config g++
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (2026-03-27)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: test-${{ matrix.features }}
          cache-bin: "false"
      - name: Install cargo-nextest
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)
              arch=x86_64-unknown-linux-gnu
              sum=a098eed56f2dd88c7fdca1e554a6b99fa1ffbd2a7a1c41b865700112981f6f52
              ;;
            aarch64|arm64)
              arch=aarch64-unknown-linux-gnu
              sum=2a6d9e1dd07b56b4bbe03b73778615dbff2f623e54c8dd4fa9642901e11494ee
              ;;
            *)
              echo "unsupported architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          curl -fsSL --proto '=https' "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.136/cargo-nextest-0.9.136-${arch}.tar.gz" \
            -o /tmp/cargo-nextest.tar.gz
          echo "${sum}  /tmp/cargo-nextest.tar.gz" | sha256sum -c -
          if [ "$(id -u)" -ne 0 ]; then S=sudo; else S=; fi
          $S tar xzf /tmp/cargo-nextest.tar.gz -C /usr/local/bin
      - name: Download embedding model for tests
        run: scripts/fetch-model.sh
      - name: Run cargo nextest tests
        run: cargo nextest run --workspace --no-fail-fast --test-threads=1 ${{ matrix.features }}

  test-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb
      # `npm run build` compiles the server crate and stages out/bin/pali, so this
      # job needs the same Rust toolchain and native dependencies as `test`.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config g++
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (2026-03-27)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: e2e
          cache-bin: "false"
      # Cached runner state: `.vscode-test` holds the VS Code build the host
      # suite launches, `test-resources` holds ExTester's VS Code and
      # ChromeDriver. Bump the salt when the cached layout or the pinned
      # VS Code major changes.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .vscode-test
            test-resources
          key: e2e-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-v1
          restore-keys: |
            e2e-${{ runner.os }}-
      - name: Install dependencies and build the extension
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run build
      - name: Extension host end-to-end
        run: xvfb-run -a npm run test:e2e
      # Seed the repository-root `.env` the launchers read, so this job
      # exercises the documented configuration path instead of only the
      # throwaway-directory fallback. PALI_E2E_STORAGE stays unset: ExTester's
      # VS Code and ChromeDriver cache lives under test-resources.
      - name: Seed the end-to-end environment
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pali-e2e/hooks" \
                   "$RUNNER_TEMP/pali-e2e/instructions" \
                   "$RUNNER_TEMP/pali-e2e/skills"
          cat > .env <<EOF
          PALI_HOOKS_DIR=$RUNNER_TEMP/pali-e2e/hooks
          PALI_INSTRUCTIONS_PATH=$RUNNER_TEMP/pali-e2e/instructions/pali-memory.instructions.md
          PALI_SKILLS_DIR=$RUNNER_TEMP/pali-e2e/skills
          EOF
      - name: Notification click end-to-end
        run: xvfb-run -a npm run test:e2e:ui
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-failure-artifacts
          path: |
            test-resources/screenshots
            test-resources/chromedriver.log
          retention-days: 3

  vsix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install dependencies
        # `npm ci` pins the resolved tree, including the package.json overrides
        # that keep the dev-dependency tree off the audit report.
        run: npm ci --ignore-scripts
      - name: Package VSIX
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          out="pali-memory-${version}-linux-x64.vsix"
          # The repository URL in package.json is self-hosted Gitea, which vsce
          # does not recognise, so the README's relative links need explicit
          # bases or packaging aborts.
          npm run package -- \
            --target linux-x64 \
            --baseContentUrl "https://github.com/cderivan/memory-mcp/src/branch/main" \
            --baseImagesUrl "https://github.com/cderivan/memory-mcp/raw/branch/main" \
            --out "$out"
          unzip -l "$out" | grep -F 'extension/out/extension.js' >/dev/null
          ls -l "$out"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pali-memory-vsix
          path: "*.vsix"
          retention-days: 1

  cross-compile:
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cargo_target: ""
          # arm64 leg, native on the spacelab runner (label ubuntu-latest-arm64
          # in infra/nomad/gitea.hcl). Native means the smoke test executes the
          # binary instead of only inspecting it with file(1).
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest-arm64
            cargo_target: ""
          - target: universal-apple-darwin
            os: macos-latest
            cargo_target: ""
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config g++
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (2026-03-27)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target }}
          cache-bin: "false"
      - run: cargo build --locked --release ${{ matrix.cargo_target }}
      # Each matrix leg builds for its own architecture, so this runs the binary
      # natively -- including aarch64, now that it builds on the spacelab runner
      # rather than being cross-compiled on cosmos.
      - name: Smoke-test the binary
        run: ./target/release/pali --version

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (2026-03-27)
        with:
          toolchain: stable
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          rust-version: stable

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: rust-default
            rust_features: ""
            js_tests: false
          - name: rust-all-features
            rust_features: "--all-features"
            js_tests: false
          - name: js-tests
            rust_features: ""
            js_tests: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config g++
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (2026-03-27)
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: coverage-${{ matrix.name }}
          cache-bin: "false"
      - name: Install cargo-nextest
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)
              arch=x86_64-unknown-linux-gnu
              sum=a098eed56f2dd88c7fdca1e554a6b99fa1ffbd2a7a1c41b865700112981f6f52
              ;;
            aarch64|arm64)
              arch=aarch64-unknown-linux-gnu
              sum=2a6d9e1dd07b56b4bbe03b73778615dbff2f623e54c8dd4fa9642901e11494ee
              ;;
            *)
              echo "unsupported architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          curl -fsSL --proto '=https' "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.136/cargo-nextest-0.9.136-${arch}.tar.gz" \
            -o /tmp/cargo-nextest.tar.gz
          echo "${sum}  /tmp/cargo-nextest.tar.gz" | sha256sum -c -
          if [ "$(id -u)" -ne 0 ]; then S=sudo; else S=; fi
          $S tar xzf /tmp/cargo-nextest.tar.gz -C /usr/local/bin
      - name: Install cargo-llvm-cov
        if: matrix.js_tests != 'true'
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)
              arch=x86_64-unknown-linux-gnu
              sum=b3f68e625481fed9b16444174f3fa5ebcdbde4a1878803a35eabe2dcefcdc41a
              ;;
            aarch64|arm64)
              arch=aarch64-unknown-linux-gnu
              sum=abf5f13c1520f8756d2192bfaaeadb0208f5b7eaa8cadc15bf847befa42b7360
              ;;
            *)
              echo "unsupported architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          curl -fsSL --proto '=https' "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.9.1/cargo-llvm-cov-${arch}.tar.gz" \
            -o /tmp/cargo-llvm-cov.tar.gz
          echo "${sum}  /tmp/cargo-llvm-cov.tar.gz" | sha256sum -c -
          if [ "$(id -u)" -ne 0 ]; then S=sudo; else S=; fi
          $S tar xzf /tmp/cargo-llvm-cov.tar.gz -C /usr/local/bin
      - name: Download embedding model for tests
        run: scripts/fetch-model.sh
      - name: Run Rust tests with coverage
        if: matrix.js_tests != 'true'
        run: |
          set -euo pipefail
          mkdir -p coverage
          cargo llvm-cov --profile test --workspace ${{ matrix.rust_features }} --no-fail-fast \
            --lcov --output-path coverage/lcov.info -- --test-threads=1
      - name: Install npm dependencies and build
        if: matrix.js_tests == 'true'
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run build:binary
      - name: Download embedding model for JS tests
        if: matrix.js_tests == 'true'
        run: scripts/fetch-model.sh
      - name: Run JS/TS tests with coverage
        if: matrix.js_tests == 'true'
        run: |
          set -euo pipefail
          npm run test:coverage
      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.name }}
          path: |
            coverage/lcov.info
          retention-days: 7
          if-no-files-found: error

  semver-checks:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (2026-03-27)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: semver
          cache-bin: "false"
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9

