jobs:
  # Formatting is advisory. This job always runs (so `build`'s `needs` stays
  # satisfiable) but the check itself is opt-in: enable it per run with
  # workflow_dispatch input `fmt-check`, or permanently with the repository
  # variable FMT_CHECK=true. The pre-commit hook still runs `cargo fmt --check`
  # against the author's own toolchain.
  # Formatting is advisory. This job always runs (so `build`'s `needs` stays
  # satisfiable) but the check itself is opt-in: enable it per run with
  # workflow_dispatch input `fmt-check`, or permanently with the repository
  # variable FMT_CHECK=true. The pre-commit hook still runs `cargo fmt --check`
  # against the author's own toolchain.
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Needed on the self-hosted Gitea instance (internal CA); harmless on
      # GitHub-hosted runners.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (2026-03-27)
        with:
          toolchain: stable
          # rustfmt/clippy are not in the minimal profile this action installs,
          # so name them instead of relying on the runner image preinstalling
          # them (GitHub images do; a bare rustup image does not).
          components: rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-bin: "false"
      - name: cargo fmt --check
        if: (github.event_name == 'workflow_dispatch' && inputs.fmt-check) || vars.FMT_CHECK == 'true'
        run: cargo fmt --check
      - name: cargo fmt --check
        if: (github.event_name == 'workflow_dispatch' && inputs.fmt-check) || vars.FMT_CHECK == 'true'
        run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
    steps:
      # Needed on the self-hosted Gitea instance (internal CA); harmless on
      # GitHub-hosted runners.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (2026-03-27)
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: clippy-${{ matrix.features }}
          cache-bin: "false"
      - run: cargo clippy --workspace ${{ matrix.features }} -- -D warnings

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
    steps:
      # Needed on the self-hosted Gitea instance (internal CA); harmless on
      # GitHub-hosted runners.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (2026-03-27)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: test-${{ matrix.features }}
          cache-bin: "false"
      - name: Install cargo-nextest
        run: |
          set -euo pipefail
          # The runner is x86_64 on cosmos and on GitHub-hosted ubuntu runners,
          # but arm64 when act runs the job on an Apple Silicon host. A
          # hardcoded x86_64 prebuilt there dies with "rosetta error: failed to
          # open elf at /lib64/ld-linux-x86-64.so.2", so pick by machine.
          case "$(uname -m)" in
            x86_64)
              arch=x86_64-unknown-linux-gnu
              sum=a098eed56f2dd88c7fdca1e554a6b99fa1ffbd2a7a1c41b865700112981f6f52
              ;;
            aarch64|arm64)
              arch=aarch64-unknown-linux-gnu
              sum=2a6d9e1dd07b56b4bbe03b73778615dbff2f623e54c8dd4fa9642901e11494ee
              ;;
            *)
              echo "unsupported architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          curl -fsSL --proto '=https' "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.136/cargo-nextest-0.9.136-${arch}.tar.gz" \
          curl -fsSL --proto '=https' "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.136/cargo-nextest-0.9.136-${arch}.tar.gz" \
            -o /tmp/cargo-nextest.tar.gz
          echo "${sum}  /tmp/cargo-nextest.tar.gz" | sha256sum -c -
          if [ "$(id -u)" -ne 0 ]; then S=sudo; else S=; fi
          $S tar xzf /tmp/cargo-nextest.tar.gz -C /usr/local/bin
      - run: cargo nextest run --workspace --no-fail-fast ${{ matrix.features }}

  # End-to-end: the extension inside a real VS Code host, and a UI run that
  # clicks the install notification (VS Code exposes no API for that, so it
  # needs a real driver). Both open a window, hence xvfb. The two large
  # downloads — VS Code for each runner and ChromeDriver for ExTester — are
  # cached, so only a lockfile change re-downloads them.
  test-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Needed on the self-hosted Gitea instance (internal CA); harmless on
      # GitHub-hosted runners.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb
      # `npm run build` compiles the server crate and stages out/bin/pali, so this
      # job needs the same Rust toolchain and native dependencies as `test`.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (2026-03-27)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: e2e
          cache-bin: "false"
      # Cached runner state: `.vscode-test` holds the VS Code build the host
      # suite launches, `test-resources` holds ExTester's VS Code and
      # ChromeDriver. Bump the salt when the cached layout or the pinned
      # VS Code major changes.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .vscode-test
            test-resources
          key: e2e-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-v1
          restore-keys: |
            e2e-${{ runner.os }}-
      - name: Install dependencies and build the extension
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run build
      - name: Extension host end-to-end
        run: xvfb-run -a npm run test:e2e
      # Seed the repository-root `.env` the launchers read, so this job
      # exercises the documented configuration path instead of only the
      # throwaway-directory fallback. PALI_E2E_STORAGE stays unset: ExTester's
      # VS Code and ChromeDriver cache lives under test-resources.
      - name: Seed the end-to-end environment
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pali-e2e/hooks" \
                   "$RUNNER_TEMP/pali-e2e/instructions" \
                   "$RUNNER_TEMP/pali-e2e/skills"
          cat > .env <<EOF
          PALI_HOOKS_DIR=$RUNNER_TEMP/pali-e2e/hooks
          PALI_INSTRUCTIONS_PATH=$RUNNER_TEMP/pali-e2e/instructions/pali-memory.instructions.md
          PALI_SKILLS_DIR=$RUNNER_TEMP/pali-e2e/skills
          EOF
      - name: Notification click end-to-end
        run: xvfb-run -a npm run test:e2e:ui
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-failure-artifacts
          path: |
            test-resources/screenshots
            test-resources/chromedriver.log
          retention-days: 3

  # Package the extension the way a release does, so broken vsce packaging or a
  # stale manifest fails on the PR instead of on the tag. No binary is staged
  # here, so this VSIX is a packaging check rather than a shippable artifact.
  vsix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Needed on the self-hosted Gitea instance (internal CA); harmless on
      # GitHub-hosted runners.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install dependencies
        # `npm ci` pins the resolved tree, including the package.json overrides
        # that keep the dev-dependency tree off the audit report.
        run: npm ci --ignore-scripts
      - name: Package VSIX
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          out="pali-memory-${version}-linux-x64.vsix"
          # The repository URL in package.json is self-hosted Gitea, which vsce
          # does not recognise, so the README's relative links need explicit
          # bases or packaging aborts.
          npm run package -- \
            --target linux-x64 \
            --baseContentUrl "https://github.com/cderivan/memory-mcp/src/branch/main" \
            --baseImagesUrl "https://github.com/cderivan/memory-mcp/raw/branch/main" \
            --out "$out"
          unzip -l "$out" | grep -F 'extension/out/extension.js' >/dev/null
          ls -l "$out"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pali-memory-vsix
          path: "*.vsix"
          retention-days: 1

  # Catch cross-platform compilation failures before they reach the release pipeline.
  # Mirrors the release.yml publish-binaries matrix (minus Windows — see #42).
  # Only runs on main-targeted PRs and pushes — stacked PRs skip this.
  cross-compile:
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cargo_target: ""
          # arm64 leg, native on the spacelab runner (label ubuntu-latest-arm64
          # in infra/nomad/gitea.hcl). Native means the smoke test executes the
          # binary instead of only inspecting it with file(1).
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest-arm64
            cargo_target: ""
          - target: universal-apple-darwin
            os: macos-latest
            cargo_target: ""
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      # Needed on the self-hosted Gitea instance (internal CA); harmless on
      # GitHub-hosted runners.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (2026-03-27)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target }}
          cache-bin: "false"
      - run: cargo build --locked --release ${{ matrix.cargo_target }}
      - run: cargo build --locked --release ${{ matrix.cargo_target }}
      # Each matrix leg builds for its own architecture, so this runs the binary
      # natively -- including aarch64, now that it builds on the spacelab runner
      # rather than being cross-compiled on cosmos.
      - name: Smoke-test the binary
        run: ./target/release/pali --version

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Needed on the self-hosted Gitea instance (internal CA); harmless on
      # GitHub-hosted runners.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  # Test coverage: Rust with llvm-cov (default + all-features), JS/TS with c8.
  # Reports are generated in lcov format and uploaded as artifacts.
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed for codecov/fellowship to upload coverage reports.
      # Remove if not using a coverage reporter.
      # id-token: write  # for codecov
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: rust-default
            rust_features: ""
            js_tests: false
          - name: rust-all-features
            rust_features: "--all-features"
            js_tests: false
          - name: js-tests
            rust_features: ""
            js_tests: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (2026-03-27)
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: coverage-${{ matrix.name }}
          cache-bin: "false"
      - name: Install cargo-nextest
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)
              arch=x86_64-unknown-linux-gnu
              sum=a098eed56f2dd88c7fdca1e554a6b99fa1ffbd2a7a1c41b865700112981f6f52
              ;;
            aarch64|arm64)
              arch=aarch64-unknown-linux-gnu
              sum=2a6d9e1dd07b56b4bbe03b73778615dbff2f623e54c8dd4fa9642901e11494ee
              ;;
            *)
              echo "unsupported architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          curl -fsSL --proto '=https' "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.136/cargo-nextest-0.9.136-${arch}.tar.gz" \
            -o /tmp/cargo-nextest.tar.gz
          echo "${sum}  /tmp/cargo-nextest.tar.gz" | sha256sum -c -
          if [ "$(id -u)" -ne 0 ]; then S=sudo; else S=; fi
          $S tar xzf /tmp/cargo-nextest.tar.gz -C /usr/local/bin
      - name: Run Rust tests with coverage
        if: matrix.js_tests != 'true'
        run: |
          set -euo pipefail
          mkdir -p coverage
          cargo llvm-cov --profile test --workspace ${{ matrix.rust_features }} --no-fail-fast \
            --lcov --output-path coverage/lcov.info
      - name: Install npm dependencies and build
        if: matrix.js_tests == 'true'
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run build:binary
      - name: Run JS/TS tests with coverage
        if: matrix.js_tests == 'true'
        run: |
          set -euo pipefail
          npm run test:coverage
      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.name }}
          path: |
            coverage/lcov.info
          retention-days: 7
          if-no-files-found: error

  semver-checks:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      # Needed on the self-hosted Gitea instance (internal CA); harmless on
      # GitHub-hosted runners.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (2026-03-27)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: semver
          cache-bin: "false"
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9

