# SonarQube scope for the Pali Memory VS Code extension (TypeScript) and its
# Rust server crate. Coverage comes from `npm run test:coverage`: c8 for
# JS/TS, cargo-llvm-cov for Rust.

sonar.projectKey=memory-mcp
sonar.projectName=Pali Memory
sonar.sourceEncoding=UTF-8

# Production code: extension TypeScript, Rust server, Copilot hooks, and the
# node build scripts.
sonar.sources=src,pali/src,hooks,scripts

# Tests: mocha suites, crate integration tests, and the node:test hook suites.
# sonar.sources and sonar.tests take plain directories, never wildcards.
sonar.tests=test,pali/tests,hooks/test

# hooks/test sits inside the hooks source root, and a file can be indexed only
# once. Source-file exclusions are separate from the test scope, so this keeps
# the hook suites as tests.
sonar.exclusions=hooks/test/**,**/target/**,**/node_modules/**,out/**,coverage/**

# c8 (lcov reporter) for JS/TS; cargo llvm-cov for the Rust crate.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.rust.lcov.reportPaths=coverage/rust-lcov.info
