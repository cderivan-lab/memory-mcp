# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = true

# --- Advisories -----------------------------------------------------------
# Replaces standalone `cargo audit`.
[advisories]
ignore = [
  # Transitive deps we can't control — unmaintained, not vulnerable.
  { id = "RUSTSEC-2024-0436", reason = "paste: transitive via thiserror/serde derive macros" },
  # No entry is needed for the historical Candle ZIP advisories
  # (RUSTSEC-2026-0367/0368/0369): Candle resolves `zip` 9.x, the patched
  # line, so nothing matches. If a Candle/Cargo change pulls a vulnerable
  # `zip` back in, cargo-deny must fail here rather than find a stale ignore.
]

# --- Licenses -------------------------------------------------------------
[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "BSL-1.0",
  "MPL-2.0",
]
confidence-threshold = 0.8

# --- Bans ------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

# --- Sources ---------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
